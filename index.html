document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"cf16f56b-8144-4574-b897-427cff0be655\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"var(--bg)\">\n<meta name=\"color-scheme\" content=\"dark light\">\n<link rel=\"manifest\" href=\"./manifest.webmanifest\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"ROL\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<link rel=\"apple-touch-icon\" href=\"./apple-touch-icon.png\">\n<link rel=\"icon\" href=\"./icon-192.png\">\n<script>\n/* the bundler injects its own viewport meta; drop it so viewport-fit=cover wins */\ndocument.querySelectorAll('meta[name=viewport]:not([content*=\"viewport-fit\"])').forEach(m=>m.remove());\n<\u002Fscript>\n<title>ROL — Rolling Obligations Log<\u002Ftitle>\n<style>\n  html{-webkit-text-size-adjust:100%}\n  body{margin:0;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;\n    font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;\n    font-size:14px;line-height:1.55}\n  a{color:var(--ac);text-decoration:none}\n  a:hover{color:var(--ac-hi)}\n  button,input,select,textarea{font-family:inherit}\n  *{box-sizing:border-box}\n  ::placeholder{color:var(--tx4)}\n  :focus-visible{outline:2px solid var(--ac);outline-offset:2px}\n  @keyframes rollup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}\n  @keyframes fadein{from{opacity:0}to{opacity:1}}\n  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(180deg,color-mix(in srgb,var(--tx) 1.4%,transparent) 0 1px,transparent 1px 3px)\"><\u002Fdiv>\n\n<div style=\"position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))\">\n\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)\">\n    <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n      <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em\"><b style=\"color:var(--ac)\">ROL<\u002Fb> Rolling Obligations Log<\u002Fspan>\n      <span style=\"color:var(--tx3);font-size:12.5px\">{{ subtitle }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;margin-left:auto;position:relative\">\n      <div style=\"color:var(--tx3);font-size:12.5px\">{{ todayLine }}<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-haspopup=\"listbox\" aria-expanded=\"{{ themeOpen }}\" aria-label=\"{{ themeLabel }}\" title=\"{{ themeLabel }}\" style=\"display:flex;align-items:center;gap:7px;min-height:32px;padding:0 9px;background:var(--s2);border:1px solid var(--line);border-radius:6px;color:var(--tx2);font-size:12.5px;cursor:pointer\">\n        <span aria-hidden=\"true\" style=\"display:flex;width:16px;height:16px;border-radius:50%;overflow:hidden;border:1px solid var(--line2);background:linear-gradient(135deg,var(--bg) 0 50%,var(--ac) 50% 100%)\"><\u002Fspan>\n        <span>{{ themeName }}<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:var(--tx4);font-size:10px\">▾<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ themeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ closeTheme }}\" style=\"position:fixed;inset:0;z-index:44\"><\u002Fdiv>\n        <div role=\"listbox\" aria-label=\"Theme\" style=\"position:absolute;top:calc(100% + 6px);right:0;z-index:45;width:min(290px,calc(100vw - 32px));max-height:min(72vh,560px);overflow-y:auto;background:var(--s1);border:1px solid var(--line2);border-radius:8px;padding:4px 6px 8px;box-shadow:0 12px 32px rgba(0,0,0,.45);animation:fadein .12s ease-out\">\n          <sc-for list=\"{{ themeGroups }}\" as=\"tg\" hint-placeholder-count=\"2\">\n            <div style=\"font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx4);padding:10px 8px 4px\">{{ tg.label }}<\u002Fdiv>\n            <sc-for list=\"{{ tg.items }}\" as=\"th\" hint-placeholder-count=\"3\">\n              <button type=\"button\" role=\"option\" aria-selected=\"{{ th.on }}\" sc-camel-on-click=\"{{ th.pick }}\" style=\"display:flex;width:100%;align-items:center;gap:10px;min-height:40px;padding:0 8px;background:{{ th.bg }};border:1px solid {{ th.line }};border-radius:5px;cursor:pointer;text-align:left;color:var(--tx);font-size:13px\">\n                <span aria-hidden=\"true\" style=\"display:flex;align-items:center;gap:3px;padding:3px 5px;border-radius:4px;background:{{ th.c0 }};border:1px solid {{ th.c1 }}\">\n                  <span style=\"width:9px;height:9px;border-radius:50%;background:{{ th.c2 }}\"><\u002Fspan>\n                  <span style=\"width:9px;height:9px;border-radius:50%;background:{{ th.c3 }}\"><\u002Fspan>\n                  <span style=\"width:9px;height:9px;border-radius:50%;background:{{ th.c4 }}\"><\u002Fspan>\n                  <span style=\"width:9px;height:9px;border-radius:50%;background:{{ th.c5 }}\"><\u002Fspan>\n                <\u002Fspan>\n                <span style=\"flex:1;min-width:0\">{{ th.name }}<\u002Fspan>\n                <span aria-hidden=\"true\" style=\"color:var(--ac)\">{{ th.mark }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px\">\n    <div role=\"tablist\" aria-label=\"Views\" style=\"display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px;flex:1;min-width:0;max-width:420px\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"2\">\n        <button type=\"button\" role=\"tab\" aria-selected=\"{{ tb.on }}\" sc-camel-on-click=\"{{ tb.pick }}\" style=\"flex:1;min-width:0;min-height:40px;border:none;border-radius:4px;cursor:pointer;font-size:13px;padding:0 10px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ openSettings }}\" aria-label=\"Settings and sync\" style=\"min-width:44px;min-height:42px;background:var(--s2);border:1px solid var(--line);color:var(--tx2);border-radius:6px;cursor:pointer;font-size:13px;padding:0 12px\">⚙<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ conflictOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <button type=\"button\" sc-camel-on-click=\"{{ openSettings }}\" style=\"display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:color-mix(in srgb,var(--bad) 9%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:6px;padding:10px 12px;margin-bottom:14px;cursor:pointer;min-height:44px\">\n      <span style=\"font-size:12.5px;color:var(--bad);line-height:1.45\">Two copies disagree — nothing is syncing until you pick one.<\u002Fspan>\n      <span style=\"font-size:12.5px;color:var(--bad);white-space:nowrap\">Resolve<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tabSched }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n\n  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:14px\">\n    <div>\n      <div style=\"font-size:16px;letter-spacing:-.01em\">{{ rangeLbl }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:var(--tx3);margin-top:1px\">{{ rangeMeta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:8px\">\n      <div role=\"group\" aria-label=\"Weeks shown\" style=\"display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px\">\n        <sc-for list=\"{{ weekChoices }}\" as=\"w\" hint-placeholder-count=\"3\">\n          <button type=\"button\" aria-pressed=\"{{ w.on }}\" sc-camel-on-click=\"{{ w.pick }}\" title=\"{{ w.title }}\" style=\"min-width:46px;min-height:38px;border:none;border-radius:4px;cursor:pointer;font-size:13px;padding:0 10px;background:{{ w.bg }};color:{{ w.fg }}\">{{ w.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ openShareWeek }}\" style=\"min-height:42px;background:var(--s2);border:1px solid var(--line);color:var(--tx2);border-radius:6px;cursor:pointer;font-size:12.5px;padding:0 12px;white-space:nowrap\">Share week<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;gap:14px;align-items:start;grid-template-columns:{{ gridCols }}\">\n\n    <section style=\"background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--s3)\">\n        <h3 style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)\">Coming up<\u002Fh3>\n        <sc-if value=\"{{ paged }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:6px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ goPrev }}\" aria-label=\"Previous week\" disabled=\"{{ atFirst }}\" style=\"min-width:44px;min-height:40px;background:var(--s2);border:1px solid var(--line);color:{{ prevInk }};border-radius:6px;cursor:pointer;font-size:15px\">←<\u002Fbutton>\n            <span aria-hidden=\"true\" style=\"display:flex;gap:5px;align-items:center;padding:0 2px\">\n              <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:{{ d.bg }}\"><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ goNext }}\" aria-label=\"Next week\" disabled=\"{{ atLast }}\" style=\"min-width:44px;min-height:40px;background:var(--s2);border:1px solid var(--line);color:{{ nextInk }};border-radius:6px;cursor:pointer;font-size:15px\">→<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ visibleWeeks }}\" as=\"wk\" hint-placeholder-count=\"2\">\n        <div style=\"margin-bottom:6px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0 6px;border-bottom:1px solid var(--line)\">\n            <span style=\"font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)\">{{ wk.label }}<\u002Fspan>\n            <span style=\"font-size:12.5px;color:var(--tx3)\">{{ wk.range }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ wk.rows }}\" as=\"row\" hint-placeholder-count=\"5\">\n            <div style=\"border-bottom:1px solid var(--s3)\">\n              <sc-if value=\"{{ row.isGap }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ row.add }}\" style=\"display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:none;cursor:pointer;text-align:left;padding:9px 2px;color:var(--tx3);font-size:12.5px;min-height:44px\">\n                  <span>{{ row.gapLabel }}<\u002Fspan>\n                  <span style=\"color:var(--tx3)\">nothing scheduled ＋<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ row.isDay }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;gap:12px;padding:9px 2px;background:{{ row.rowBg }};border-radius:5px\">\n                  <div style=\"flex:0 0 82px;min-width:0\">\n                    <div style=\"font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:{{ row.dowInk }}\">{{ row.dow }}<\u002Fdiv>\n                    <div style=\"font-size:15px;letter-spacing:-.01em;color:{{ row.numInk }}\">{{ row.dnum }}<\u002Fdiv>\n                    <sc-if value=\"{{ row.badge }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;display:inline-block;padding:2px 6px;border-radius:4px;border:1px solid {{ row.badgeLine }};color:{{ row.badgeInk }}\">{{ row.badge }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center\">\n                    <sc-if value=\"{{ row.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ row.add }}\" style=\"align-self:flex-start;background:transparent;border:none;color:var(--tx3);font-size:12.5px;cursor:pointer;padding:6px 4px;min-height:36px\">— add ＋<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-for list=\"{{ row.events }}\" as=\"ev\" hint-placeholder-count=\"1\">\n                      <div style=\"display:flex;align-items:stretch;gap:2px;background:var(--s2);border:1px solid var(--line);border-left:2px solid {{ ev.accent }};border-radius:5px;opacity:{{ ev.dim }}\">\n                        <label style=\"position:relative;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;cursor:pointer;flex:0 0 auto\">\n                          <input type=\"checkbox\" checked=\"{{ ev.done }}\" sc-camel-on-change=\"{{ ev.toggle }}\" aria-label=\"{{ ev.doneLabel }}\" style=\"appearance:none;-webkit-appearance:none;width:19px;height:19px;margin:0;border:1px solid {{ ev.tickLine }};border-radius:3px;background:{{ ev.tickBg }};cursor:pointer\">\n                          <sc-if value=\"{{ ev.done }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span aria-hidden=\"true\" style=\"position:absolute;inset:0;display:grid;place-content:center;color:var(--ok);font-size:13px;pointer-events:none\">✓<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Flabel>\n                        <button type=\"button\" sc-camel-on-click=\"{{ ev.open }}\" style=\"flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:transparent;border:none;cursor:pointer;text-align:left;padding:11px 12px 11px 2px;min-height:44px;color:inherit\">\n                          <span style=\"color:{{ ev.timeInk }};font-variant-numeric:tabular-nums;white-space:nowrap;font-size:{{ ev.timeSize }}\">{{ ev.time }}<\u002Fspan>\n                          <span style=\"flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.35;font-size:15px;color:{{ ev.titleInk }};text-decoration:{{ ev.strike }}\">{{ ev.title }}<\u002Fspan>\n                          <sc-if value=\"{{ ev.isRep }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"color:var(--ac2);font-size:11.5px;white-space:nowrap\">{{ ev.repLabel }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fbutton>\n                        <button type=\"button\" sc-camel-on-click=\"{{ ev.send }}\" aria-label=\" ursor:pointer;font-size:12.5px;border-radius:0 5px 5px 0\">{{ passToggle }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ unlock }}\" style=\"width:100%;min-height:48px;background:var(--ac);border:none;color:var(--onac);font-weight:600;border-radius:6px;cursor:pointer;font-size:14px\">Unlock<\u002Fbutton>\n                <div style=\"font-size:12.5px;color:var(--tx3);margin-top:8px;line-height:1.5\">Held in memory for this session only — never written to disk. Nobody can reset it.<\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ signOut }}\" style=\"margin-top:10px;min-height:40px;background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:5px;cursor:pointer;font-size:12.5px;padding:0 12px\">Sign out<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ sConflict }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"font-size:12.5px;color:var(--bad);margin-bottom:12px;line-height:1.5\">Both copies changed. Nothing has been overwritten — pick the one to keep.<\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ keepLocal }}\" style=\"display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);border-left:2px solid var(--ac);border-radius:6px;cursor:pointer;padding:12px;margin-bottom:10px;min-height:46px\">\n                  <div style=\"font-size:13.5px;color:var(--tx);margin-bottom:3px\">Keep this device<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--tx3);line-height:1.5\">{{ cfMine }}<br>last synced {{ cfMineWhen }}<\u002Fdiv>\n                <\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ takeRemote }}\" disabled=\"{{ cfNoTake }}\" style=\"display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);bor
